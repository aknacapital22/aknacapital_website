kind = "web"
previewPath = "/"
title = "AKNA Capital"
version = "1.0.0"
id = "artifacts/akna-capital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22992

[services.development]
run = "pnpm --filter @workspace/akna-capital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akna-capital", "run", "build" ]
serve = "static"
publicDir = "artifacts/akna-capital/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22992"
BASE_PATH = "/"
