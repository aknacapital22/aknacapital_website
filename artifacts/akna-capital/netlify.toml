[build]
  base = "artifacts/akna-capital"
  command = "pnpm install && pnpm run build"
  publish = "dist"

# Domain aliasing (www.aknacapital.com -> aknacapital.com) and HTTPS
# enforcement are handled automatically by Netlify's domain management
# (aknacapital.com is set as the primary domain there). Manual redirects
# duplicating that here caused a redirect loop, so don't re-add them —
# configure canonical-domain behavior in the Netlify UI (Domain
# management) instead of here.

# Old /businesses/* paths (pre-rename) — 301 to the new /services/* paths
# so any indexed links or bookmarks don't land on a soft-404.
[[redirects]]
  from = "/businesses/research-ranking"
  to = "/services/research-ranking"
  status = 301
[[redirects]]
  from = "/businesses/mutual-fund-investing"
  to = "/services/mutual-fund-investing"
  status = 301
[[redirects]]
  from = "/businesses/akna-private-wealth"
  to = "/services/akna-private-wealth"
  status = 301
[[redirects]]
  from = "/businesses/stockmarket-workshop"
  to = "/services/stockmarket-workshop"
  status = 301
[[redirects]]
  from = "/businesses/insurance"
  to = "/services/insurance"
  status = 301
[[redirects]]
  from = "/businesses/algo-trading"
  to = "/services/algo-trading"
  status = 301

# SPA catch-all — serves index.html for all routes (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
