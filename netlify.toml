[build]
  base = "artifacts/akna-capital"
  command = "pnpm install && pnpm run build"
  publish = "dist"

# Domain aliasing (aknacapital.com -> www.aknacapital.com) and HTTPS
# enforcement are handled automatically by Netlify's domain management
# (www.aknacapital.com is set as the primary domain there). Manual
# redirects duplicating that here caused a redirect loop, so don't
# re-add them — configure canonical-domain behavior in the Netlify UI
# (Domain management) instead of here.

# SPA catch-all — serves index.html for all routes (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
